version: "3.7"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg-dev-web
    ports:
      - "${WEB_PORT}:3000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./src/data:/app/data
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - default
      - dev-network

  # ECG converter — LIRYC ecg_converter (C# ECG Toolkit via Mono) wrapped in
  # FastAPI. Reads device-native ECG (SCP-ECG, aECG, MUSE-XML, ISHNE, DICOM,
  # Omron) and converts to aECG/CSV/etc. POST /convert.
  ecg-converter:
    build:
      context: .
      dockerfile: docker/ecg-converter.Dockerfile
    container_name: ecg-dev-ecg-converter
    ports:
      - "${ECG_CONVERTER_PORT}:80"
    restart: unless-stopped
    networks:
      - default
      - dev-network

  database:
    image: mysql:8.0
    container_name: ecg-dev-database
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --tmpdir=/var/lib/mysql/tmp
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - mysql-tmp:/tmp
    restart: unless-stopped
    networks:
      - default
      - dev-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecg-dev-phpmyadmin
    tmpfs:
      - /sessions:mode=1733,uid=33,gid=33
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500000000
      PMA_ABSOLUTE_URI: https://${DOMAIN}/phpmyadmin/
    depends_on:
      - database
    restart: unless-stopped

  # DeepECG Backend (FastAPI) — works without GPU, AI engine added later
  deepecg-backend:
    build:
      context: ./deepecg/backend
      dockerfile: Dockerfile
    container_name: ecg-dev-deepecg
    ports:
      - "${DEEPECG_BACKEND_PORT}:8000"
    environment:
      - APP_NAME=DeepECGAnalyser
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - AI_ENGINE_URL=http://ai-engine:8001
      - AI_ENGINE_MODE=rest
      - TEMP_DIR=/tmp/deepecg
      - MAX_UPLOAD_SIZE_MB=25
    volumes:
      - ./data/deepecg-temp:/tmp/deepecg
      - ./data/deepecg-work:/data
    restart: unless-stopped
    networks:
      - default
      - dev-network

  deepecg-frontend:
    build:
      context: ./deepecg/frontend
      dockerfile: Dockerfile
    container_name: ecg-dev-deepecg-frontend
    ports:
      - "${DEEPECG_FRONTEND_PORT}:5173"
    depends_on:
      - deepecg-backend
    restart: unless-stopped
    networks:
      - default
      - dev-network

  # AI Engine — requires GPU, kept as profile (start manually when GPU available)
  # To start: docker compose --profile gpu up -d ai-engine
  ai-engine:
    image: deepecg-docker
    container_name: ecg-dev-ai-engine
    command: sh -c "while true; do sleep 3600; done"
    profiles:
      - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data/deepecg-work:/data
    restart: unless-stopped

networks:
  dev-network:
    external: true

volumes:
  mysql-tmp:
