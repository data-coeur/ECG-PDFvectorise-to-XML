<body>
<div class="hdr">
  <h1>⚡ ECG PDF → Signal Numérique</h1>

</div>
<div class="c">
  <div class="dz" id="dz">

<script type="module">
import*as pdfjsLib from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs';

const SERVER_URL = 'ecg_receive.php';
const DATA_URL = 'data/';
const LN=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'],O=pdfjsLib.OPS;
let D=null;const $=id=>document.getElementById(id);

const FORMAT_INFO = {
  edf: {
    label: 'EDF+',
    badge: 'std', badgeText: 'Standard',
    desc: 'European Data Format — Standard ouvert pour les signaux physiologiques. Lisible par EDFbrowser, Polyman, MATLAB, Python (pyedflib). Créé en 1992 pour la polysomnographie, adopté universellement.'
  },
  wfdb_hea: {
    label: 'WFDB',
    badge: 'std', badgeText: 'PhysioNet',
    desc: 'WaveForm DataBase — Format de PhysioNet (MIT). Fichier .hea (en-tête texte) + .dat (données binaires). Standard de référence pour la recherche en cardiologie. Compatible avec la WFDB library et PhysioBank.'
  },
  dicom: {
    label: 'DICOM',
    badge: 'med', badgeText: 'Médical',
    desc: 'DICOM Waveform — Format standard hospitalier pour l\'imagerie et les signaux médicaux. Compatible PACS, intégrable au dossier patient. Norme ISO/IEC pour l\'interopérabilité médicale.'
  },
  hdf5: {
    label: 'HDF5',
    badge: 'std', badgeText: 'Scientifique',
    desc: 'Hierarchical Data Format v5 — Format binaire haute performance pour données massives. Utilisé par la NASA, le CERN, et en deep learning (TensorFlow, PyTorch). Auto-descriptif avec métadonnées intégrées.'
  },
  webp: {
    label: 'WebP 4K',
    badge: 'img', badgeText: 'Image',
    desc: 'Image 4K (3840×2160) avec grille ECG standard (1mm/5mm), pulse de calibration 1mV/200ms et labels. Format WebP de Google pour un rendu net et un poids réduit.'
  }
};

const dz=$('dz'),fi=$('fi'),st=$('st'),res=$('res'),mg=$('mg'),cc=$('cc'),snd=$('snd'),dl=$('dl');
dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');e.dataTransfer.files.length&&go(e.dataTransfer.files[0])};
fi.onchange=e=>e.target.files.length&&go(e.target.files[0]);
snd.onclick=send;dl.onclick=download;
$('tj').onclick=()=>{const j=$('jp');j.style.display=j.style.display==='none'?'block':'none'};
function S(m,t=''){st.innerHTML=t?`<span class="${t}">${m}</span>`:m}

async function go(f){
  if(!f.name.toLowerCase().endsWith('.pdf')){S('❌ Non-PDF','err');return}
  S('<span class="sp"></span> Extraction...');
  res.style.display='none';$('dlArea').style.display='none';snd.disabled=dl.disabled=true;
  try{
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    const pg=await pdf.getPage(1),r=await extract(pg,f.name);
    if(!r||!r.channels.length){S('❌ Aucun signal ECG vectoriel','err');return}
    D=r;show(r);
    S(`✅ ${r.channels.length} canaux · ${r.manufacturer} · ${r.layout}`,'ok');
    snd.disabled=dl.disabled=false;
  }catch(e){console.error(e);S(`❌ ${e.message}`,'err')}
}

/* ────────── Matrix helpers ────────── */
// 6-element affine matrix [a,b,c,d,e,f]:
//   x' = a*x + c*y + e
//   y' = b*x + d*y + f
function matMul(m1,m2){
  return[
    m1[0]*m2[0]+m1[2]*m2[1],       m1[1]*m2[0]+m1[3]*m2[1],
    m1[0]*m2[2]+m1[2]*m2[3],       m1[1]*m2[2]+m1[3]*m2[3],
    m1[0]*m2[4]+m1[2]*m2[5]+m1[4], m1[1]*m2[4]+m1[3]*m2[5]+m1[5]
  ];
}
function matApply(m,x,y){return{x:m[0]*x+m[2]*y+m[4],y:m[1]*x+m[3]*y+m[5]}}

async function extract(pg,fn){
  const vp=pg.getViewport({scale:1}),ops=await pg.getOperatorList(),tc=await pg.getTextContent();

  /* ── Parse paths WITH CTM tracking ── */
  const ap=parse(ops,vp);

  /* ── Labels: already in viewport coords via convertToViewportPoint ── */
  const lb=[];
  for(const it of tc.items){
    const t=it.str.trim();
    if(LN.includes(t)){
      const[x,y]=vp.convertToViewportPoint(it.transform[4],it.transform[5]);
      lb.push({text:t,x,y});
    }
  }

  const tr=idTraces(ap);
  if(!tr.length)return null;

  /* ── Compute scale from the actual viewport-space coordinates ── */
  const sc=scale(vp);

  /* ── Detect layout & assign ── */
  const lay=detectLay(tr,vp);
  const ch=assign(tr,lb,lay);

  return{
    manufacturer:mfr(tr,fn),layout:lay.type,filename:fn,
    page_size:{width:Math.round(vp.width),height:Math.round(vp.height)},
    scale:{mm_per_s:25,mm_per_mV:10,pts_per_mm:Math.round(sc.pmm*100)/100},
    channels:ch.map(c=>{const s=phys(c.pts,sc,lay);return{name:c.name,samples:s.samples,duration_s:s.dur,
      sample_rate_hz:s.samples.length>1?Math.round(s.samples.length/s.dur):0,voltage_unit:'mV',time_unit:'s'}})
  };
}

/* ────────────────────────────────────────────────────────────
   parse() — extract polylines with full CTM → viewport transform
   
   pdf.js constructPath / moveTo / lineTo coordinates are in the
   PDF content-stream "user space" which may be scaled/rotated by
   one or more cm (concat matrix) operators BEFORE the viewport
   transform.  We track the graphics-state CTM through save/restore/
   transform operators and compose it with the viewport transform so
   every point ends up in true viewport coordinates (CSS pixels).
   
   Safety: if the resulting points fall outside viewport bounds,
   pdf.js already applied the CTM internally, so we fall back to
   viewport-only transform.
   ──────────────────────────────────────────────────────────── */
function parse(ops,vp){
  const vpT=vp.transform; // page→viewport transform

  // First pass: try with CTM tracking (CTM + viewport)
  const withCTM = _parseWithCTM(ops, vpT);
  
  // Safety check: are most points within 2x viewport bounds?
  const margin = Math.max(vp.width, vp.height) * 0.5;
  const bounds = {
    xMin: -margin, xMax: vp.width + margin,
    yMin: -margin, yMax: vp.height + margin
  };
  
  let inBounds = 0, total = 0;
  for(const p of withCTM){
    for(const pt of p.pts){
      total++;
      if(pt.x >= bounds.xMin && pt.x <= bounds.xMax &&
         pt.y >= bounds.yMin && pt.y <= bounds.yMax) inBounds++;
    }
    if(total > 500) break; // sample enough
  }
  
  if(total > 0 && inBounds/total > 0.5){
    // CTM tracking worked — points are in viewport space
    return withCTM;
  }
  
  // Fallback: pdf.js already applied CTM, use viewport-only transform
  console.log('[ECG] CTM tracking gave out-of-bounds coords, falling back to viewport-only');
  return _parseViewportOnly(ops, vpT);
}

function _parseWithCTM(ops, vpT){
  const P=[];
  let c=[], col=[0,0,0], w=1;
  let ctm=[1,0,0,1,0,0];
  const ctmStack=[];
  function fullT(){return matMul(vpT,ctm);}
  function fl(){if(c.length>1) P.push({pts:c.slice(), col:col.slice(), w}); c=[];}
  function addPt(ux,uy){const m=fullT(); c.push(matApply(m,ux,uy));}

  for(let i=0;i<ops.fnArray.length;i++){
    const f=ops.fnArray[i], a=ops.argsArray[i];
    switch(f){
      case O.save:  ctmStack.push(ctm.slice()); break;
      case O.restore: if(ctmStack.length) ctm=ctmStack.pop(); break;
      case O.transform: ctm=matMul(ctm,a); break;
      case O.setStrokeRGBColor: col=[a[0],a[1],a[2]]; break;
      case O.setStrokeGray:     col=[a[0],a[0],a[0]]; break;
      case O.setLineWidth:      w=a[0]; break;
      case O.moveTo: fl(); addPt(a[0],a[1]); break;
      case O.lineTo:        addPt(a[0],a[1]); break;
      case O.stroke: case O.closeStroke: case O.fillStroke: fl(); break;
      case O.endPath: case O.fill: case O.eoFill: c=[]; break;
      case O.constructPath:{
        const s=a[0], sa=a[1]; let ai=0;
        for(const op of s){switch(op){
          case O.moveTo:  fl(); addPt(sa[ai++],sa[ai++]); break;
          case O.lineTo:        addPt(sa[ai++],sa[ai++]); break;
          case O.curveTo: ai+=4;addPt(sa[ai++],sa[ai++]); break;
          case O.curveTo2:case O.curveTo3:ai+=2;addPt(sa[ai++],sa[ai++]); break;
          case O.rectangle: ai+=4; c=[]; break;
          default: break;
        }} break;
      }
    }
  }
  fl();
  return P;
}

function _parseViewportOnly(ops, vpT){
  const P=[];
  let c=[], col=[0,0,0], w=1;
  function fl(){if(c.length>1) P.push({pts:c.slice(), col:col.slice(), w}); c=[];}
  function addPt(ux,uy){c.push(matApply(vpT,ux,uy));}

  for(let i=0;i<ops.fnArray.length;i++){
    const f=ops.fnArray[i], a=ops.argsArray[i];
    switch(f){
      case O.setStrokeRGBColor: col=[a[0],a[1],a[2]]; break;
      case O.setStrokeGray:     col=[a[0],a[0],a[0]]; break;
      case O.setLineWidth:      w=a[0]; break;
      case O.moveTo: fl(); addPt(a[0],a[1]); break;
      case O.lineTo:        addPt(a[0],a[1]); break;
      case O.stroke: case O.closeStroke: case O.fillStroke: fl(); break;
      case O.endPath: case O.fill: case O.eoFill: c=[]; break;
      case O.constructPath:{
        const s=a[0], sa=a[1]; let ai=0;
        for(const op of s){switch(op){
          case O.moveTo:  fl(); addPt(sa[ai++],sa[ai++]); break;
          case O.lineTo:        addPt(sa[ai++],sa[ai++]); break;
          case O.curveTo: ai+=4;addPt(sa[ai++],sa[ai++]); break;
          case O.curveTo2:case O.curveTo3:ai+=2;addPt(sa[ai++],sa[ai++]); break;
          case O.rectangle: ai+=4; c=[]; break;
          default: break;
        }} break;
      }
    }
  }
  fl();
  return P;
}

function idTraces(P){
  // Filter black polylines with enough points
  let c=P.filter(p=>p.col[0]<.15&&p.col[1]<.15&&p.col[2]<.15&&p.pts.length>50);
  if(!c.length)return[];
  c.sort((a,b)=>b.pts.length-a.pts.length);
  const mx=c[0].pts.length;
  c=c.filter(p=>p.pts.length>=mx*.15);

  for(const t of c){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const p of t.pts){
      if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x;
      if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
    }
    t.bb={x0,x1,y0,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,dx:x1-x0,dy:y1-y0};
  }
  return c.slice(0,15);
}

/* ── detectLay: detect layout from viewport-space bounding boxes ── */
function detectLay(tr,vp){
  const pw=vp.width, ph=vp.height;

  // Check monotonicity to determine time axis
  // For each trace, is X monotonically increasing (time=X) or Y (time=Y)?
  let xMonoCount=0, yMonoCount=0;
  for(const t of tr){
    const pts=t.pts;
    let xMono=true, yMonoInc=true, yMonoDec=true;
    for(let i=1;i<pts.length;i++){
      if(pts[i].x < pts[i-1].x - 0.5) xMono=false;
      if(pts[i].y < pts[i-1].y - 0.5) yMonoInc=false;
      if(pts[i].y > pts[i-1].y + 0.5) yMonoDec=false;
    }
    if(xMono) xMonoCount++;
    if(yMonoInc||yMonoDec) yMonoCount++;
  }

  // Determine time axis from monotonicity
  let tA, vI;
  if(xMonoCount >= tr.length*0.8){
    tA='x'; vI=true;  // X = time (normal horizontal traces)
  } else if(yMonoCount >= tr.length*0.8){
    tA='y'; vI=true;  // Y = time (vertical traces like MUSE)
    // For MUSE-style vertical traces: the calibration pulse deflects leftward
    // for positive voltage, so we need to invert: mv = -(x - median) / ppv
  } else {
    // Fallback: use bounding box aspect ratio
    const adx=tr.reduce((s,t)=>s+t.bb.dx,0)/tr.length;
    const ady=tr.reduce((s,t)=>s+t.bb.dy,0)/tr.length;
    tA = adx >= ady ? 'x' : 'y';
    vI = tA==='x';
  }

  // Determine layout type
  // stacked_12x1: all traces span most of the page along time axis
  const timeExtent = tA==='x' ? pw : ph;
  const allWide = tr.every(t => (tA==='x' ? t.bb.dx : t.bb.dy) > timeExtent*0.6);

  // Also check if traces are arranged in distinct rows along time-perpendicular axis
  // For stacked_12x1: traces should be at DIFFERENT positions along the perp axis
  // For 6x2: traces cluster into 2 groups along the perp axis (e.g. top half / bottom half)
  const perpKey = tA==='x' ? 'cy' : 'cy'; // always group by cy (vertical position on screen)
  const perpVals = tr.map(t=>t.bb[perpKey]);
  const perpMin = Math.min(...perpVals), perpMax = Math.max(...perpVals);
  const perpMid = (perpMin+perpMax)/2;
  const grp1 = tr.filter(t=>t.bb[perpKey] < perpMid);
  const grp2 = tr.filter(t=>t.bb[perpKey] >= perpMid);

  // If two clear groups of ~6 each, it's 6x2
  if(grp1.length>=4 && grp2.length>=4 && grp1.length<=8 && grp2.length<=8){
    return{type:'sequential_6x2', tA, vI};
  }

  if(allWide){
    return{type:'stacked_12x1', tA, vI};
  }

  return{type:'stacked_12x1', tA, vI};
}

/* ── assign: match traces to lead names using labels ── */
function assign(tr,lb,lay){
  if(lay.type==='stacked_12x1'){
    // For stacked: sort traces by their baseline position perpendicular to time axis
    // and match with labels sorted the same way
    const perpKey = lay.tA==='x' ? 'cy' : 'cx';
    const labelSortKey = lay.tA==='x' ? 'y' : 'x';
    const s=tr.slice().sort((a,b)=>a.bb[perpKey]-b.bb[perpKey]);
    const sl=lb.slice().sort((a,b)=>a[labelSortKey]-b[labelSortKey]);
    return s.map((t,i)=>({
      name: i<sl.length ? sl[i].text : i<LN.length ? LN[i] : `L${i+1}`,
      pts: t.pts
    }));
  }

  // 6x2 layout: split into two groups by vertical position (cy)
  // Group 1 = top half of viewport (smaller cy), Group 2 = bottom half
  const cyVals = tr.map(t=>t.bb.cy);
  const cyMid = (Math.min(...cyVals)+Math.max(...cyVals))/2;

  // Within each group, sort by horizontal position (cx) = order of leads
  const g1=tr.filter(t=>t.bb.cy<cyMid).sort((a,b)=>a.bb.cx-b.bb.cx);
  const g2=tr.filter(t=>t.bb.cy>=cyMid).sort((a,b)=>a.bb.cx-b.bb.cx);

  // Match labels to groups using the same cy split
  let l1,l2;
  if(lb.length>=12){
    const labelYs = lb.map(l=>l.y);
    const labelMid = (Math.min(...labelYs)+Math.max(...labelYs))/2;
    l1=lb.filter(l=>l.y<labelMid).sort((a,b)=>a.x-b.x);
    l2=lb.filter(l=>l.y>=labelMid).sort((a,b)=>a.x-b.x);
  } else {
    l1=LN.slice(0,6).map(n=>({text:n}));
    l2=LN.slice(6).map(n=>({text:n}));
  }

  const ch=[];
  for(let i=0;i<g1.length;i++)
    ch.push({name:i<l1.length?l1[i].text:`L${i+1}`, pts:g1[i].pts});
  for(let i=0;i<g2.length;i++)
    ch.push({name:i<l2.length?l2[i].text:`L${i+7}`, pts:g2[i].pts});

  ch.sort((a,b)=>{
    const ia=LN.indexOf(a.name), ib=LN.indexOf(b.name);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return ch;
}

function mfr(tr,fn){
  const f=fn.toLowerCase();
  if(f.includes('muse')||f.includes('12sl'))return'GE MUSE';
  if(f.includes('schiller')||f.includes('scm')||f.includes('nodata'))return'Schiller';
  const a=tr.reduce((s,t)=>s+t.pts.length,0)/tr.length;
  if(a>3000)return'Philips/Spacelabs';
  if(a>1500)return'GE MUSE (probable)';
  if(a<600)return'Schiller (probable)';
  return'Inconnu';
}

/* ── scale: compute pts/mm from viewport dimensions ── */
function scale(vp){
  const w=vp.width, h=vp.height;
  // Determine physical page size (mm) from the LARGER dimension
  const maxDim=Math.max(w,h), minDim=Math.min(w,h);
  let wm,hm;
  // A4: 297×210mm → 842×595pt
  if(Math.abs(maxDim-842)<10 && Math.abs(minDim-595)<10){ wm=297; hm=210; }
  // US Letter: 279.4×215.9mm → 792×612pt
  else if(Math.abs(maxDim-792)<10 && Math.abs(minDim-612)<10){ wm=279.4; hm=215.9; }
  // Fallback
  else { wm=w/2.8346; hm=h/2.8346; }

  // pts_per_mm for each axis (should be ~equal but handle rotation)
  const pmmX = w / (w>=h ? wm : hm);
  const pmmY = h / (w>=h ? hm : wm);
  const pmm = (pmmX+pmmY)/2; // average, typically ~2.835
  return{pmm, pps:pmm*25, ppv:pmm*10, pmmX, pmmY};
}

/* ── phys: convert viewport-space points to physical mV samples ── */
function phys(pts,sc,lay){
  if(pts.length<2)return{samples:[],dur:0};
  const tA=lay.tA, vK=tA==='x'?'y':'x';
  const ppsAxis = tA==='x' ? sc.pmmX*25 : sc.pmmY*25;
  const ppvAxis = vK==='y' ? sc.pmmY*10 : sc.pmmX*10;

  // Sort by time axis (ascending in the time-coordinate direction)
  let s=pts.slice().sort((a,b)=>a[tA]-b[tA]);

  // Check if time axis is running in reverse (Y decreasing = time forward)
  // If first point has larger time-coord than last point in the ORIGINAL order,
  // the data was drawn from high→low, so our ascending sort is correct (early→late)
  // But if the first drawn point was at high Y and last at low Y, ascending sort
  // gives us the correct chronological order (low Y = later time on screen, but
  // earlier sample in the sorted array... this needs careful thought)

  // Actually: for MUSE with tA='y', viewport Y goes from ~812 (first sample)
  // to ~460 (last sample). Sorting ascending (460→812) reverses chronological order.
  // We need to detect this and reverse.
  // Heuristic: check the original data order. If the first point has a LARGER
  // time-axis value than the last point, the data is drawn in decreasing order.
  if(pts.length>10){
    const firstT = pts[0][tA], lastT = pts[pts.length-1][tA];
    if(firstT > lastT + 1){
      // Data was drawn in decreasing time-axis order → reverse our sort
      s.reverse();
    }
  }

  // Duration
  const dur=Math.abs(s[s.length-1][tA]-s[0][tA])/ppsAxis;

  // Voltage: subtract median, convert to mV
  const vv=s.map(p=>p[vK]).slice().sort((a,b)=>a-b);
  const med=vv[Math.floor(vv.length/2)];

  const samples=s.map(p=>{
    let mv=(p[vK]-med)/ppvAxis;
    if(lay.vI) mv=-mv;
    return Math.round(mv*10000)/10000;
  });
  return{samples,dur};
}

function show(d){
  res.style.display='block';mg.innerHTML='';
  for(const[k,v]of[['Fabricant',d.manufacturer],['Layout',d.layout],['Canaux',d.channels.length],['Échelle',`${d.scale.mm_per_s}mm/s · ${d.scale.mm_per_mV}mm/mV`]]){
    const e=document.createElement('div');e.className='mi';e.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`;mg.appendChild(e);}
  cc.innerHTML='';
  for(const ch of d.channels){
    const e=document.createElement('div');e.className='cc';
    e.innerHTML=`<div class="ch"><span class="n">${ch.name}</span><span class="i">${ch.samples.length} pts · ${ch.duration_s.toFixed(2)}s · ${ch.sample_rate_hz}Hz</span></div><div class="cb"><canvas width="1400" height="70"></canvas></div>`;
    cc.appendChild(e);draw(e.querySelector('canvas'),ch.samples);}
  $('jc').textContent=JSON.stringify(d,null,2).substring(0,100000);
}
function draw(cv,s){const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;ctx.fillStyle='#0a0e17';ctx.fillRect(0,0,w,h);if(s.length<2)return;ctx.strokeStyle='rgba(34,211,238,.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();let mn=1e9,mx=-1e9;for(const v of s){if(v<mn)mn=v;if(v>mx)mx=v}const r=Math.max(mx-mn,.05),m=(mx+mn)/2,sc=h*.85/r;ctx.strokeStyle='#00ff88';ctx.lineWidth=1.2;ctx.beginPath();for(let i=0;i<s.length;i++){const x=i/(s.length-1)*w,y=h/2-(s[i]-m)*sc;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();}

async function send(){
  if(!D)return;
  S('<span class="sp"></span> Envoi et conversion...');$('dlArea').style.display='none';
  try{
    const r=await fetch(SERVER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});
    if(!r.ok){S(`❌ Erreur ${r.status} ${r.statusText}`,'err');return}
    const j=await r.json();
    if(!j.success){S(`❌ ${j.error||'Erreur serveur'}`,'err');return}
    showDownloads(j);
    S(`✅ ${Object.keys(j.files).length} formats générés · ${j.info.channels} canaux · ${j.info.sample_rate} Hz · ${j.info.duration}s`,'ok');
  }catch(e){S(`❌ ${e.message}`,'err')}
}

function showDownloads(j){
  const area=$('dlArea'),grid=$('dlGrid');
  area.style.display='block';grid.innerHTML='';
  const order=['edf','wfdb_hea','dicom','hdf5','webp'];
  for(const key of order){
    if(!j.files[key])continue;
    const info=FORMAT_INFO[key]||{label:key,desc:'',badge:'std',badgeText:'?'};
    const href=DATA_URL+j.files[key];
    let extra='';
    if(key==='wfdb_hea'&&j.files.wfdb_dat){
      extra=`<div class="ext">📎 télécharge aussi : <a href="${DATA_URL+j.files.wfdb_dat}" style="color:var(--ac)">.dat</a></div>`;
    }
    const ext=j.files[key].split('.').pop();
    const badgeCls=info.badge==='med'?'badge-med':info.badge==='img'?'badge-img':'badge-std';
    const card=document.createElement('a');
    card.className='dl-card';card.href=href;card.download=j.files[key];
    card.innerHTML=`<span class="badge ${badgeCls}">${info.badgeText}</span><div class="fmt">${info.label}</div><div class="desc">${info.desc}</div><div class="ext">.${ext}</div>${extra}`;
    grid.appendChild(card);
  }
}

function download(){
  if(!D)return;const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
  a.download=`ecg_${Date.now()}.json`;a.click();
}
