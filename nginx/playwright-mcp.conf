server {
    listen 80;
    server_name playwright-mcp.data-coeur.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playwright-mcp.data-coeur.com;

    ssl_certificate /etc/nginx/ssl/live/playwright-mcp.data-coeur.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/playwright-mcp.data-coeur.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # OAuth discovery — no rate limit
    location /.well-known/ {
        proxy_pass http://host.docker.internal:8386/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth endpoints — no rate limit
    location /oauth/ {
        proxy_pass http://host.docker.internal:8386/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health — no rate limit
    location /health {
        proxy_pass http://host.docker.internal:8386/health;
        proxy_set_header Host $host;
    }

    # MCP endpoint — rate limited
    location /mcp/ {
        limit_req zone=mcp_limit burst=20 nodelay;

        proxy_pass http://host.docker.internal:8386/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
