# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name ecg-dev.data-coeur.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name ecg-dev.data-coeur.com;

    client_max_body_size 100M;

    ssl_certificate /etc/nginx/ssl/live/ecg-dev.data-coeur.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ecg-dev.data-coeur.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ECG_SSL:10m;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # OAuth discovery — claude.ai looks at root level
    # ============================================
    location /.well-known/oauth-authorization-server {
        proxy_pass http://host.docker.internal:8385/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth endpoints at root — for claude.ai redirect flow
    location /oauth/ {
        proxy_pass http://host.docker.internal:8385/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # MCP endpoint — rate limited + OAuth required
    # ============================================
    location /mcp/ {
        limit_req zone=mcp_limit burst=20 nodelay;

        proxy_pass http://host.docker.internal:8385/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ============================================
    # PhpMyAdmin — restricted to Samuel only
    # ============================================
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }
    location /phpmyadmin/ {
        allow 86.70.70.130;
        deny all;

        proxy_pass http://host.docker.internal:8301/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # DeepECG API backend
    # ============================================
    location /api/deepecg/ {
        proxy_pass http://host.docker.internal:8302/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # DeepECG frontend (React, base: /deepecg/)
    # ============================================
    location /deepecg/ {
        proxy_pass http://host.docker.internal:8303/deepecg/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Main web app (PHP)
    # ============================================
    location / {
        proxy_pass http://host.docker.internal:8300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
